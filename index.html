<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유이 아카이브 · 007로저의 파이 아침 브리핑</title>
<meta name="description" content="007로저가 매일 아침 X에 올리는 파이 네트워크 브리핑 '유이'를 날짜별로 모아 둔 곳. 사기 경보만 모아 보기, 검색 가능.">
<meta property="og:title" content="유이 아카이브 · 007로저">
<meta property="og:description" content="매일 아침 파이 소식과 사기 경보를 한곳에 🍀">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f6f3ec; --card:#fffdf8; --ink:#2a2620; --sub:#6d665a; --line:#e4ddcf;
  --accent:#3f7d4e; --accent-soft:rgba(63,125,78,.10);
  --warn:#b4372f; --warn-soft:rgba(180,55,47,.08);
  --sun:#c98a12; --chip:#efe9dc;
  --serif:"Gowun Batang","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#14130f; --card:#1d1b16; --ink:#ece6d8; --sub:#a59d8c; --line:#2f2c25;
    --accent:#7cc48d; --accent-soft:rgba(124,196,141,.12); --warn:#ef8a80; --warn-soft:rgba(239,138,128,.10);
    --sun:#f0b84a; --chip:#26231d; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}
header{padding:36px 0 18px}
.eyebrow{font-size:12.5px;color:var(--sub);letter-spacing:.04em}
h1{font-family:var(--serif);font-size:clamp(34px,8vw,48px);line-height:1.15;margin:6px 0 8px}
h1 span{color:var(--accent)}
.lede{margin:0;color:var(--sub);font-size:15px}
.by{margin-top:10px;font-size:13.5px;color:var(--sub)}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.search select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:0 8px;max-width:42%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.warn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:13px;color:var(--sub);margin:14px 2px 0;min-height:20px}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 14px;margin-top:16px;scroll-margin-top:150px}
.day-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.day-date{font-family:var(--serif);font-size:22px;font-weight:700;margin:0}
.day-wd{font-size:13px;color:var(--sub)}
.day-link{margin-left:auto;min-height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--sub);font:inherit;font-size:12.5px;cursor:pointer}
.day-link:focus-visible{outline:2px solid var(--accent)}
.sec{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.sec:first-of-type{border-top:none;padding-top:0}
.sec-h{font-size:14px;font-weight:700;color:var(--accent);margin:0 0 4px}
.sec.scam{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:12px;padding:10px 12px;margin-top:14px}
.sec.scam .sec-h{color:var(--warn)}
.sec.poll .sec-h{color:var(--sun)}
.txt{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:15.5px}
mark{background:rgba(240,184,74,.45);color:inherit;border-radius:3px;padding:0 1px}
.more{display:block;width:100%;min-height:48px;margin-top:18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.more[hidden]{display:none}
.empty{margin-top:24px;padding:24px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--sub)}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--sub)}
footer p{margin:6px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">PI MORNING BRIEFING ARCHIVE</div>
    <h1>유이 <span>아카이브</span></h1>
    <p class="lede">매일 아침 X에 올리는 파이 네트워크 한 줄 정리, 유머와 이슈, 그리고 사기 경보를 날짜별로 모아 두는 곳이에요. 🍀</p>
    <div class="by">007로저 · <a href="https://x.com/minkyeungsoon31" target="_blank" rel="noopener">X @minkyeungsoon31</a></div>
  </header>

  <div class="tools">
    <div class="search">
      <label for="q" class="sr" style="position:absolute;left:-9999px">유이 검색</label>
      <input id="q" type="search" placeholder="검색 (예: KYC, 거래소, 패스프레이즈)" autocomplete="off">
      <label for="jump" style="position:absolute;left:-9999px">날짜로 가기</label>
      <select id="jump"><option value="">날짜로 가기</option></select>
    </div>
    <div class="chips" role="group" aria-label="보기 고르기">
      <button type="button" class="chip" data-f="all" aria-pressed="true">전체</button>
      <button type="button" class="chip warn" data-f="scam" aria-pressed="false">🚨 사기 경보만</button>
      <button type="button" class="chip" data-f="issue" aria-pressed="false">📰 이슈</button>
      <button type="button" class="chip" data-f="humor" aria-pressed="false">😄 유머</button>
      <button type="button" class="chip" data-f="cheer" aria-pressed="false">💬 응원 한마디</button>
    </div>
  </div>

  <div class="status" id="status" role="status" aria-live="polite">불러오는 중…</div>
  <main id="list"></main>
  <button type="button" class="more" id="more" hidden>이전 유이 더 보기</button>

  <footer>
    <p>유이는 그날 아침까지 확인한 내용을 바탕으로 써요. 지난 날짜의 유이는 그날 기준의 이야기예요.</p>
    <p>투자 권유가 아니에요. 패스프레이즈(24단어)는 누구에게도 알려 주지 마세요.</p>
    <p>매일의 투표는 <a href="https://dibutades8708.pinet.com" target="_blank" rel="noopener">디부타데스</a>에서 · © 2026 007로저</p>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ---------- 유이 아카이브 ----------
// 데이터는 같은 저장소의 yui.md 한 파일. "## 2026-11-25" 줄 아래에 그날 유이를 그대로 붙여 넣으면 됨.
const SOURCE = 'yui.md';
const PAGE = 10;
// 섹션 제목 알아보기 (번호·이모지·기호가 앞에 있어도 됨)
const SECTIONS = [
  { key: 'humor', re: /^오늘의\s*유머/, label: '😄 오늘의 유머' },
  { key: 'issue', re: /^오늘의\s*(이슈|소식)/, label: '📰 오늘의 이슈' },
  { key: 'scam',  re: /^(오늘의\s*)?사기\s*경보/, label: '🚨 오늘의 사기 경보' },
  { key: 'doodle',re: /^오늘의\s*낙서/, label: '✏️ 오늘의 낙서' },
  { key: 'cheer', re: /^응원\s*한\s*마디/, label: '💬 응원 한마디' },
  { key: 'poll',  re: /^오늘의\s*투표(\s*후보)?/, label: '🗳️ 오늘의 투표 후보' }
];
const WD = ['일','월','화','수','목','금','토'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
let DAYS = [], filter = 'all', query = '', shown = PAGE;

function headingKey(line){
  // 앞쪽 번호·이모지·기호·마크다운 표시를 걷어 내고 제목인지 확인
  const t = line.replace(/^[\s#>*\-–—_\d.)\]\[|:·•]+/u, '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
  if(t.length > 30) return null;
  for(const s of SECTIONS) if(s.re.test(t)) return s.key;
  return null;
}
function parseDay(body){
  const secs = []; let cur = { key: 'intro', lines: [] };
  for(const line of body.split('\n')){
    const k = headingKey(line);
    if(k){ if(cur.lines.join('').trim()) secs.push(cur); cur = { key: k, lines: [] }; }
    else cur.lines.push(line);
  }
  if(cur.lines.join('').trim()) secs.push(cur);
  return secs.map(s => ({ key: s.key, text: s.lines.join('\n').replace(/^\s*\n+|\s+$/g, '') }));
}
function parse(md){
  const out = []; const re = /^##\s*(\d{4})-(\d{2})-(\d{2})\s*$/gm; let m; const marks = [];
  while((m = re.exec(md))) marks.push({ date: `${m[1]}-${m[2]}-${m[3]}`, start: m.index, bodyStart: re.lastIndex });
  marks.forEach((mk, i) => {
    const body = md.slice(mk.bodyStart, i + 1 < marks.length ? marks[i + 1].start : md.length).replace(/<!--[\s\S]*?-->/g, '');
    if(body.trim()) out.push({ date: mk.date, secs: parseDay(body) });
  });
  // 같은 날짜가 두 번이면 처음 것만, 최신 날짜부터
  const seen = new Set();
  return out.filter(d => !seen.has(d.date) && seen.add(d.date)).sort((a, b) => b.date.localeCompare(a.date));
}
function dateLabel(d){
  const [y, m, day] = d.split('-').map(Number);
  return { main: `${y}. ${m}. ${day}.`, wd: WD[new Date(Date.UTC(y, m - 1, day)).getUTCDay()] + '요일' };
}
function linkify(html){
  return html.replace(/(https?:\/\/[^\s<]+[^\s<.,!?)'"])/g, u => `<a href="${u}" target="_blank" rel="noopener nofollow">${u}</a>`);
}
function highlight(html){
  if(!query) return html;
  const qs = esc(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  // 태그 밖의 글자에만 표시
  return html.replace(/(<[^>]+>)|([^<]+)/g, (all, tag, txt) => tag ? tag : txt.replace(new RegExp(qs, 'gi'), x => `<mark>${x}</mark>`));
}
function secHtml(s){
  const def = SECTIONS.find(x => x.key === s.key);
  const cls = s.key === 'scam' ? ' scam' : s.key === 'poll' ? ' poll' : '';
  return `<section class="sec${cls}">${def ? `<h3 class="sec-h">${def.label}</h3>` : ''}<div class="txt">${highlight(linkify(esc(s.text)))}</div></section>`;
}
function visible(){
  const q = query.toLowerCase();
  return DAYS.map(d => {
    let secs = filter === 'all' ? d.secs : d.secs.filter(s => s.key === filter);
    if(q) secs = secs.filter(s => s.text.toLowerCase().includes(q) || filter === 'all' && d.date.includes(q));
    if(q && filter === 'all' && !secs.length && d.date.includes(q)) secs = d.secs;
    return { date: d.date, secs };
  }).filter(d => d.secs.length);
}
function render(){
  const list = visible(), part = list.slice(0, shown);
  $('list').innerHTML = part.map(d => {
    const L = dateLabel(d.date);
    return `<article class="day" id="d${d.date}"><div class="day-head"><h2 class="day-date">${L.main}</h2><span class="day-wd">${L.wd}</span>
      <button type="button" class="day-link" data-date="${d.date}" aria-label="${L.main} 유이 링크 복사">🔗 링크</button></div>
      ${d.secs.map(secHtml).join('')}</article>`;
  }).join('') || `<div class="empty">${DAYS.length ? '찾는 내용이 없어요. 다른 말로 검색해 보세요.' : '아직 올라온 유이가 없어요. 곧 채워질 거예요 🍀'}</div>`;
  $('more').hidden = list.length <= shown;
  const label = { all: '', scam: '사기 경보', issue: '이슈', humor: '유머', cheer: '응원 한마디' }[filter];
  $('status').textContent = DAYS.length
    ? `${query ? `"${query}" ` : ''}${label ? label + ' · ' : ''}${list.length}일치${list.length > shown ? ` 중 ${shown}일 표시` : ''} · 전체 ${DAYS.length}일`
    : '';
}
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800); }
async function copy(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch(_){} ta.remove(); return ok;
  }
}
function goTo(date){
  if(!DAYS.some(d => d.date === date)) return;
  filter = 'all'; query = ''; $('q').value = '';
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.f === 'all')));
  const idx = DAYS.findIndex(d => d.date === date); shown = Math.max(PAGE, idx + 1); render();
  const el = $('d' + date); if(el) el.scrollIntoView({ block: 'start' });
}

// 이벤트
let qTimer;
$('q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { query = e.target.value.trim(); shown = PAGE; render(); }, 200); });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  filter = c.dataset.f; shown = PAGE;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === c)));
  render();
}));
$('more').addEventListener('click', () => { shown += PAGE; render(); });
$('jump').addEventListener('change', e => { if(e.target.value){ history.replaceState(null, '', '#' + e.target.value); goTo(e.target.value); e.target.value = ''; } });
$('list').addEventListener('click', async e => {
  const b = e.target.closest('.day-link'); if(!b) return;
  const url = location.href.split('#')[0] + '#' + b.dataset.date;
  toast(await copy(url) ? '이 날 유이 링크를 복사했어요' : '복사하지 못했어요');
});
window.addEventListener('hashchange', () => goTo(location.hash.slice(1)));

// 불러오기
(async function(){
  try{
    const r = await fetch(SOURCE + '?_=' + Date.now(), { cache: 'no-store' });
    if(!r.ok) throw new Error(r.status);
    DAYS = parse(await r.text());
  }catch(e){ $('status').textContent = '유이를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.'; return; }
  $('jump').innerHTML = '<option value="">날짜로 가기</option>' + DAYS.map(d => { const L = dateLabel(d.date); return `<option value="${d.date}">${L.main} (${L.wd.slice(0, 1)})</option>`; }).join('');
  render();
  if(/^#\d{4}-\d{2}-\d{2}$/.test(location.hash)) goTo(location.hash.slice(1));
})();
</script>
</body>
</html>
